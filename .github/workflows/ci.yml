name: artifact-ci
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m rain.cli.demo_shuffle --clients 4 --dimension 17 --chunk-size 7
      - run: python -m rain.cli.demo_round --clients 4 --dimension 31 --chunk-size 16
